<title>Horas por Técnico</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper: #f5f5f5;
    --ink: #2d3142;
    --muted: #4f5d75;
    --soft: #7a8399;
    --accent: #eb6c36;
    --accent-tint: rgba(235,108,54,0.08);
    --accent-fill-12: rgba(235,108,54,0.12);
    --muted-fill-15: rgba(79,93,117,0.15);
    --overlay-06: rgba(45,49,66,0.06);
    --overlay-08: rgba(45,49,66,0.08);
    --overlay-10: rgba(45,49,66,0.10);
    --overlay-25: rgba(45,49,66,0.25);
    --font-sans: 'Geist', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #2d3142;
      --ink: #f5f5f5;
      --muted: #bfc0c0;
      --soft: #8e98ac;
      --accent: #f08a59;
      --accent-tint: rgba(240,138,89,0.10);
      --accent-fill-12: rgba(240,138,89,0.14);
      --muted-fill-15: rgba(191,192,192,0.15);
      --overlay-06: rgba(245,245,245,0.06);
      --overlay-08: rgba(245,245,245,0.08);
      --overlay-10: rgba(245,245,245,0.10);
      --overlay-25: rgba(245,245,245,0.25);
    }
  }
  :root[data-theme="dark"] {
    --paper: #2d3142;
    --ink: #f5f5f5;
    --muted: #bfc0c0;
    --soft: #8e98ac;
    --accent: #f08a59;
    --accent-tint: rgba(240,138,89,0.10);
    --accent-fill-12: rgba(240,138,89,0.14);
    --muted-fill-15: rgba(191,192,192,0.15);
    --overlay-06: rgba(245,245,245,0.06);
    --overlay-08: rgba(245,245,245,0.08);
    --overlay-10: rgba(245,245,245,0.10);
    --overlay-25: rgba(245,245,245,0.25);
  }

  body {
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
  }

  .frame { max-width: 1100px; width: 100%; }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: var(--font-serif);
    font-size: clamp(1.5rem, 2.2vw + 0.75rem, 2rem);
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    text-wrap: balance;
    margin-bottom: 0.5rem;
  }

  .subtitle {
    font-family: var(--font-sans);
    font-size: 0.9rem;
    color: var(--muted);
    max-width: 65ch;
    margin-bottom: 1.75rem;
  }

  svg { width: 100%; min-width: 720px; display: block; }

  .footer {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--overlay-10);
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--soft);
  }

  .grid-line { stroke: var(--overlay-08); stroke-width: 0.8; }
  .grid-line-top { stroke: var(--overlay-06); stroke-width: 0.8; }
  .axis-line { stroke: var(--overlay-25); stroke-width: 1; }
  .tick-label { fill: var(--muted); font-size: 8px; font-family: var(--font-mono); }
  .axis-title { fill: var(--muted); font-size: 7px; font-family: var(--font-mono); letter-spacing: 0.14em; }
  .cat-label { fill: var(--ink); font-size: 11px; font-weight: 600; font-family: var(--font-sans); }
  .value-label { fill: var(--ink); font-size: 9px; font-weight: 600; font-family: var(--font-mono); }
  .mask { fill: var(--paper); }
  .seg-normal { fill: var(--muted-fill-15); stroke: var(--muted); stroke-width: 1; }
  .seg-extra { fill: var(--accent-fill-12); stroke: var(--accent); stroke-width: 1; }
  .legend-rule { stroke: var(--overlay-10); stroke-width: 0.8; }
  .legend-text { fill: var(--muted); font-family: var(--font-mono); }
  .legend-label { fill: var(--muted); font-size: 8px; letter-spacing: 0.18em; font-family: var(--font-mono); }
</style>
